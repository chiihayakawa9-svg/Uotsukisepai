<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#321c43">
<meta name="description" content="嘘つき先輩は、私にだけ本気。スマホ向け乙女ゲーム">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>嘘つき先輩は、私にだけ本気。</title>
<style>
:root{--ink:#fff8ff;--muted:#d8c5df;--pink:#ffb5d6;--rose:#e875aa;--violet:#b7a0ff;--panel:#291936;--line:#684a75}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#633b70 0,#21152e 54%,#120e1d 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;min-height:100vh}
button,input{font:inherit}button{cursor:pointer;border:1px solid #a783b6;background:linear-gradient(135deg,#9b558c,#59417f);color:white;border-radius:14px;padding:12px 14px;font-weight:700;box-shadow:0 5px 16px #0a07144a}button:active{transform:scale(.98)}button.secondary{background:#2d2039;border-color:#6f557a}button:disabled{opacity:.45;cursor:not-allowed}
.app{max-width:760px;margin:auto;min-height:100vh;padding:18px 14px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
header{text-align:center;padding:14px 8px 4px} .eyebrow{font-size:.75rem;letter-spacing:.22em;color:var(--pink)}h1{font-size:clamp(1.65rem,6vw,2.65rem);line-height:1.35;margin:8px 0;color:#fff1fb;text-shadow:0 3px 20px #f19dcd55} .subtitle{color:var(--muted);font-size:.85rem}
.panel{background:linear-gradient(155deg,#382442eF,#21172ceF);border:1px solid #765782;border-radius:22px;padding:16px;box-shadow:0 12px 35px #08051055}
h2{font-size:1.05rem;margin:0 0 12px;color:#ffd5e8}h3{margin:0 0 8px;font-size:1rem}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #80648b;background:#180f24;color:white;margin:8px 0 12px}
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.menu-grid button{min-height:54px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#1a1225;border:1px solid #513b5d;border-radius:13px;padding:10px}.stat-label{font-size:.75rem;color:var(--muted)}.bar{height:7px;border-radius:8px;background:#44334e;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,#e875aa,#c5a4ff);width:0%;transition:width .25s}
.scene-art{height:180px;border-radius:18px;border:1px solid #886594;background:linear-gradient(145deg,#7e4b87,#302144 60%,#171122);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;margin-bottom:14px}
.scene-art:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#f4a7dc22;filter:blur(2px);top:-55px;right:-25px}.silhouette{font-size:5rem;filter:drop-shadow(0 7px 12px #110819);z-index:1}.art-caption{position:absolute;bottom:10px;left:12px;color:#f3dced;font-size:.72rem;letter-spacing:.08em}
.chapter-tag{display:inline-block;font-size:.75rem;color:#ffd0e5;border:1px solid #956b99;padding:5px 9px;border-radius:999px;margin-bottom:10px}
.dialogue{font-size:1rem;line-height:1.95;white-space:pre-line;min-height:125px}.speaker{font-weight:800;color:#ffb5d6;margin-bottom:5px}.choices{display:grid;gap:9px;margin-top:12px}.choices button{text-align:left;line-height:1.5;background:linear-gradient(120deg,#654477,#3b2a55);border-color:#a67db6}
.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1}.small{font-size:.8rem;color:var(--muted);line-height:1.6}.hidden{display:none!important}.list{display:grid;gap:8px}.list button{text-align:left}.notice{font-size:.8rem;color:#f7cde6;background:#42253f;border-radius:12px;padding:10px}.ending{font-size:1.25rem;color:#ffd2e8;font-weight:800}.footer{text-align:center;color:#bba7c7;font-size:.7rem;padding:5px}
@media(min-width:600px){.scene-art{height:240px}.dialogue{font-size:1.08rem}.app{padding-top:24px}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="eyebrow">AN OFFICE ROMANCE VISUAL NOVEL</div>
<h1>嘘つき先輩は、<br>私にだけ本気。</h1>
<div class="subtitle">笑顔の奥に隠された、本当の気持ち。</div>
</header>
<section id="home" class="panel">
<h2>ふたりの物語をはじめよう</h2>
<label for="playerName" class="small">主人公の名前（あとから変更できます）</label>
<input id="playerName" maxlength="12" placeholder="例：美月" autocomplete="off">
<div class="menu-grid">
<button id="startBtn">はじめから</button>
<button id="continueBtn" class="secondary">つづきから</button>
<button id="chaptersBtn" class="secondary">章を選ぶ</button>
<button id="galleryBtn" class="secondary">イベント回想</button>
<button id="loadBtn" class="secondary">ロード</button>
<button id="resetBtn" class="secondary">データ初期化</button>
</div>
<p class="small">※セーブデータはこの端末のブラウザ内に保存されます。ブラウザのデータ削除などで消える場合があります。</p>
</section>

<section id="chapterPanel" class="panel hidden"><h2>章を選択</h2><div id="chapterList" class="list"></div><button class="secondary" id="backFromChapters" style="margin-top:12px;width:100%">タイトルへ戻る</button></section>
<section id="galleryPanel" class="panel hidden"><h2>イベント回想</h2><div id="galleryList" class="list"></div><button class="secondary" id="backFromGallery" style="margin-top:12px;width:100%">タイトルへ戻る</button></section>
<section id="loadPanel" class="panel hidden"><h2>ロード</h2><div id="saveList" class="list"></div><button class="secondary" id="backFromLoad" style="margin-top:12px;width:100%">タイトルへ戻る</button></section>

<section id="game" class="hidden">
<div class="panel">
<div class="stats">
<div class="stat"><div class="stat-label">瀬名の好感度 <span id="affectionNum">0</span></div><div class="bar"><div id="affectionBar" class="fill"></div></div></div>
<div class="stat"><div class="stat-label">瀬名の嫉妬度 <span id="jealousyNum">0</span></div><div class="bar"><div id="jealousyBar" class="fill"></div></div></div>
</div>
</div>
<div class="panel">
<div class="scene-art"><div class="silhouette" id="sceneEmoji">🌙</div><div class="art-caption" id="sceneCaption">AFTER HOURS · 20:47</div></div>
<div class="chapter-tag" id="chapterTag">第1章</div>
<div class="speaker" id="speaker"></div>
<div class="dialogue" id="dialogue"></div>
<div class="choices" id="choices"></div>
<div class="row" style="margin-top:14px">
<button class="secondary" id="saveBtn">セーブ</button>
<button class="secondary" id="titleBtn">タイトルへ</button>
</div>
</div>
</section>
<section id="result" class="panel hidden"><div class="eyebrow">STORY END</div><h2 id="endingTitle">エンディング</h2><div class="ending" id="endingText"></div><p id="endingDesc"></p><div class="row"><button id="retryBtn">もう一度遊ぶ</button><button class="secondary" id="endingTitleBtn">タイトルへ</button></div></section>
<div class="footer">MADE WITH LOVE · SENPAI ROUTE / DEMO 01</div>
</div>
<script>
const $=id=>document.getElementById(id);
const STORE='usotsukiSenpaiSaveV1';
const chapters=[
{title:'第1章　いつもの、うざい先輩',emoji:'☀️',caption:'MONDAY · 09:12',event:'first_meeting',nodes:[
{speaker:'ナレーション',text:'月曜日の朝。営業企画部のフロアに、聞き慣れた軽い声が響いた。'},
{speaker:'瀬名',text:'おはよ、{name}ちゃん。今日も俺に会えてうれしい？'},
{speaker:'あなた',text:'朝から元気ですね。仕事してください。'},
{speaker:'瀬名',text:'つれなーい。そういうところも含めて、俺と付き合えばいいのに。',choices:[
{text:'「はいはい、冗談はいいので」',a:1,j:0,next:4},
{text:'「……誰にでも言ってますよね」',a:0,j:1,next:5},
{text:'「先輩みたいな人はナシです」',a:0,j:0,next:6}]},
{speaker:'瀬名',text:'あはは、ひど。ま、いつものことか。',next:7},
{speaker:'瀬名',text:'……誰にでも、ね。',next:7},
{speaker:'瀬名',text:'即答すんなって。地味に傷つくんだけど？',next:7},
{speaker:'ナレーション',text:'瀬名は笑っている。けれど、その笑顔が一瞬だけ消えたことに、あなたは気づかなかった。',event:'first_tease',choices:[{text:'次へ',next:'end'}]}
]},
{title:'第2章　覚えていたんですか',emoji:'🍬',caption:'BREAK TIME · 15:26',event:'favorite_snack',nodes:[
{speaker:'ナレーション',text:'午後の休憩。デスクに戻ると、見覚えのある小さなお菓子が置かれていた。'},
{speaker:'瀬名',text:'それ、新作。前に好きって言ってたじゃん。'},
{speaker:'あなた',text:'……覚えてたんですか？'},
{speaker:'瀬名',text:'そりゃね。好きなものくらい覚えるでしょ。',choices:[
{text:'「ありがとうございます。うれしいです」',a:2,j:0,next:4},
{text:'「誰にでも配ってるんですか？」',a:0,j:1,next:5},
{text:'「餌付けしても懐きませんよ」',a:1,j:0,next:6}]},
{speaker:'瀬名',text:'……そういう顔、反則だろ。',next:7},
{speaker:'瀬名',text:'俺がそんなに信用ない？',next:7},
{speaker:'瀬名',text:'はいはい、手強いワンちゃんだこと。',next:7},
{speaker:'ナレーション',text:'からかう声はいつも通り。でも彼は、あなたが包み紙を大事そうにしまったのを見て、少しだけ安心した。',event:'remembered_snack',choices:[{text:'次へ',next:'end'}]}
]},
{title:'第3章　歓迎会の帰り道',emoji:'🌃',caption:'NIGHT · 21:18',event:'jealousy',nodes:[
{speaker:'ナレーション',text:'歓迎会の帰り。あなたが同僚の男性と楽しそうに話していると、瀬名が横から顔を出した。'},
{speaker:'瀬名',text:'なに、盛り上がってんじゃん。俺も混ぜてよ。'},
{speaker:'あなた',text:'先輩はあっちで女の子たちと話してたじゃないですか。'},
{speaker:'瀬名',text:'あれ、もしかして妬いてる？',choices:[
{text:'「自意識過剰です」',a:0,j:1,next:4},
{text:'「……先輩こそ、気になるんですか？」',a:2,j:1,next:5},
{text:'「誰と話そうが私の自由です」',a:0,j:0,next:6}]},
{speaker:'瀬名',text:'だよねー。……って、ちょっとくらい気にしてくれてもいいのに。',next:7},
{speaker:'瀬名',text:'……気になるに決まってんじゃん。',next:7},
{speaker:'瀬名',text:'うん。そういうとこ、ちゃんとしてるよな。',next:7},
{speaker:'ナレーション',text:'駅までの道、瀬名はいつもより少しだけ静かだった。別れ際に「着いたら連絡して」と言った声が、妙に優しかった。',event:'station_walk',choices:[{text:'次へ',next:'end'}]}
]},
{title:'第4章　冗談なら、もういいです',emoji:'🌧️',caption:'OVERTIME · 20:54',event:'turning_point',nodes:[
{speaker:'ナレーション',text:'残業でふたりきりになったオフィス。窓の向こうでは、雨が街の灯りを滲ませていた。'},
{speaker:'瀬名',text:'ねえ。俺と付き合えばいいのに、って言ったらどうする？'},
{speaker:'あなた',text:'……そういうの、やめてください。'},
{speaker:'瀬名',text:'え。'},
{speaker:'あなた',text:'先輩、誰にでもそういうこと言うじゃないですか。私、そういうの、もういいです。',choices:[
{text:'本音を隠して「迷惑です」と言う',a:-1,j:0,next:5},
{text:'「冗談じゃないなら、ちゃんと言ってください」',a:3,j:0,next:6},
{text:'何も言わず、仕事に戻る',a:0,j:1,next:7}]},
{speaker:'瀬名',text:'……そっか。ごめん。もう言わない。',next:8},
{speaker:'瀬名',text:'……それ、冗談じゃなかったら？',next:8},
{speaker:'瀬名',text:'いつもの軽口が、今夜だけは喉につかえた。',next:8},
{speaker:'ナレーション',text:'初めて、瀬名が冗談で逃げなかった。あなたは彼の横顔を見られないまま、胸の痛みを抱えて帰った。',event:'no_more_jokes',choices:[{text:'次へ',next:'end'}]}
]},
{title:'第5章　嘘つき先輩の本音',emoji:'💗',caption:'FRIDAY · 19:40',event:'confession',nodes:[
{speaker:'ナレーション',text:'あの日から、瀬名はあなたをからかわなくなった。仕事の会話だけになったデスクが、こんなに静かだなんて知らなかった。'},
{speaker:'瀬名',text:'……これ、明日の資料。確認頼める？'},
{speaker:'あなた',text:'はい。お疲れさまです。'},
{speaker:'瀬名',text:'なあ。俺、もう冗談でごまかさないから。',choices:[
{text:'「聞きます」',a:2,j:0,next:4},
{text:'「……今さら遅いです」',a:0,j:1,next:5},
{text:'「またからかうつもりですか？」',a:-1,j:1,next:6}]},
{speaker:'瀬名',text:'好きだよ。ずっと。お前が思ってるより、ずっと前から。',next:7},
{speaker:'瀬名',text:'そうだよな。俺が悪かった。信じてほしいなんて、勝手だよな。',next:7},
{speaker:'瀬名',text:'……そう思わせたの、俺だもんな。ごめん。',next:7},
{speaker:'ナレーション',text:'いつも余裕そうな先輩の手が、ほんの少し震えていた。初めて見る、嘘のない顔だった。',event:'true_confession',choices:[{text:'エンディングへ',next:'end'}]}
]}
];
let state={name:'',chapter:0,node:0,affection:0,jealousy:0,seen:[],unlocked:1,history:[],ended:false};
function saveData(){try{localStorage.setItem(STORE,JSON.stringify(state));return true}catch(e){return false}}
function loadData(){try{const s=JSON.parse(localStorage.getItem(STORE));if(s&&typeof s==='object'){state={...state,...s};return true}}catch(e){}return false}
function showOnly(id){['home','chapterPanel','galleryPanel','loadPanel','game','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function updateStats(){$('affectionNum').textContent=state.affection;$('jealousyNum').textContent=state.jealousy;$('affectionBar').style.width=Math.min(100,Math.max(0,state.affection*5))+'%';$('jealousyBar').style.width=Math.min(100,Math.max(0,state.jealousy*10))+'%'}
function start(ch=0){state.chapter=ch;state.node=0;state.ended=false;state.history=[];if(ch===0){state.affection=0;state.jealousy=0;state.seen=[];state.unlocked=1}showOnly('game');render()}
function render(){
 const chapter=chapters[state.chapter];if(!chapter){finish();return}
 if(state.node==='end'){finishChapter();return}
 const node=chapter.nodes[state.node];if(!node){finishChapter();return}
 $('chapterTag').textContent=chapter.title;$('sceneEmoji').textContent=chapter.emoji;$('sceneCaption').textContent=chapter.caption;
 $('speaker').textContent=node.speaker;$('dialogue').textContent=node.text.replaceAll('{name}',state.name||'あなた');
 $('choices').innerHTML='';updateStats();
 if(node.event&&!state.seen.includes(node.event))state.seen.push(node.event);
 const choices=node.choices||[{text:'次へ',next:state.node+1}];
 choices.forEach(c=>{const b=document.createElement('button');b.textContent=c.text;b.onclick=()=>{state.affection=Math.max(0,Math.min(20,state.affection+(c.a||0)));state.jealousy=Math.max(0,Math.min(10,state.jealousy+(c.j||0)));state.history.push({chapter:state.chapter,node:state.node});if(c.next==='end'){state.node='end'}else{state.node=c.next}render()};$('choices').appendChild(b)});
 saveData();
}
function finishChapter(){
 if(state.chapter>=chapters.length-1){finish();return}
 state.unlocked=Math.max(state.unlocked,Math.min(chapters.length,state.chapter+2));
 if(state.chapter<chapters.length-1){$('speaker').textContent='ナレーション';$('dialogue').textContent='この章はここまで。ふたりの距離は、少しだけ変わった。';$('choices').innerHTML='';const b=document.createElement('button');b.textContent='次の章へ';b.onclick=()=>start(state.chapter+1);$('choices').appendChild(b);const t=document.createElement('button');t.className='secondary';t.textContent='タイトルへ';t.onclick=()=>showOnly('home');$('choices').appendChild(t);return}
 finish();
}
function finish(){
 state.ended=true;let title,desc;
 if(state.affection>=8&&state.jealousy<=4){title='TRUE END：冗談じゃなく、君が好き';desc='「今度はちゃんと、彼氏として誘ってもいい？」瀬名はもう笑ってごまかさなかった。あなたもやっと、自分の気持ちを伝えられた。';}
 else if(state.affection>=4){title='HAPPY END：不器用なふたり';desc='すぐに素直にはなれない。それでもふたりは、少しずつ本音を言葉にすることにした。';}
 else if(state.jealousy>=3){title='BITTERSWEET END：言えなかった本音';desc='好きだからこそ、試すような言葉ばかり選んでしまった。次に会うときは、少しだけ素直になれますように。';}
 else {title='NORMAL END：いつもの距離';desc='今日もふたりは、同僚として笑い合う。物語はまだ、終わっていない。';}
 $('endingTitle').textContent=title;$('endingText').textContent=title;$('endingDesc').textContent=desc;showOnly('result');saveData();
}
function showChapters(){ $('chapterList').innerHTML='';chapters.forEach((c,i)=>{const b=document.createElement('button');b.textContent=(i<state.unlocked?c.title:'🔒 '+c.title);b.disabled=i>=state.unlocked;b.onclick=()=>start(i);$('chapterList').appendChild(b)});showOnly('chapterPanel')}
function showGallery(){const names={first_meeting:'いつもの朝',first_tease:'冗談の奥の本音',favorite_snack:'覚えていたんですか',remembered_snack:'不器用な気遣い',jealousy:'歓迎会の帰り道',station_walk:'駅までの道',turning_point:'冗談なら、もういいです',no_more_jokes:'変わってしまった距離',confession:'嘘つき先輩の本音',true_confession:'初めての告白'};$('galleryList').innerHTML='';const seen=state.seen||[];Object.entries(names).forEach(([key,name])=>{const b=document.createElement('button');b.textContent=(seen.includes(key)?'💗 ':'🔒 ')+name;b.disabled=!seen.includes(key);$('galleryList').appendChild(b)});showOnly('galleryPanel')}
function showSaves(){const s=JSON.parse(localStorage.getItem(STORE)||'null');$('saveList').innerHTML='';if(!s){$('saveList').innerHTML='<p class="small">セーブデータがありません。</p>'}else{const b=document.createElement('button');b.textContent=`セーブデータ：${chapters[s.chapter]?.title||'物語'} ／ 好感度 ${s.affection||0}`;b.onclick=()=>{state={...state,...s};showOnly('game');render()};$('saveList').appendChild(b)}showOnly('loadPanel')}
$('startBtn').onclick=()=>{state.name=$('playerName').value.trim()||'美月';start(0)};
$('continueBtn').onclick=()=>{if(loadData()){ $('playerName').value=state.name;showOnly(state.ended?'result':'game');if(!state.ended)render()}else alert('セーブデータがありません。まずは「はじめから」を選んでね。')};
$('chaptersBtn').onclick=()=>{state.name=$('playerName').value.trim()||state.name||'美月';showChapters()};
$('galleryBtn').onclick=()=>{loadData();showGallery()};
$('loadBtn').onclick=()=>showSaves();
$('resetBtn').onclick=()=>{if(confirm('このゲームのセーブデータを初期化しますか？')){localStorage.removeItem(STORE);state={name:'',chapter:0,node:0,affection:0,jealousy:0,seen:[],unlocked:1,history:[],ended:false};alert('データを初期化しました。')}};
$('saveBtn').onclick=()=>{saveData();alert('この端末にセーブしました！')};
$('titleBtn').onclick=()=>{saveData();showOnly('home')};
$('backFromChapters').onclick=()=>showOnly('home');$('backFromGallery').onclick=()=>showOnly('home');$('backFromLoad').onclick=()=>showOnly('home');
$('retryBtn').onclick=()=>start(0);$('endingTitleBtn').onclick=()=>showOnly('home');
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
if(loadData())$('playerName').value=state.name;
</script>
</body>
</html>
